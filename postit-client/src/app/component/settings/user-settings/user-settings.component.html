<div class="userSettings">
  <div class="mat-elevation-z2 myTable">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th scope="col" mat-header-cell *matHeaderCellDef i18n="@@userSettings.id">Id</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <ng-container matColumnDef="username">
        <th scope="col" mat-header-cell *matHeaderCellDef i18n="@@userSettings.username">Username</th>
        <td mat-cell *matCellDef="let element" class="paddingTd">
          <mat-form-field>
            <input matInput placeholder="Username" i18n-placeholder [(ngModel)]="element.username" required />
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="password">
        <th scope="col" mat-header-cell *matHeaderCellDef i18n="@@userSettings.password">Password</th>
        <td mat-cell *matCellDef="let element" class="paddingTd">
          <mat-form-field>
            <input
              matInput
              placeholder="Password"
              i18n-placeholder="@@userSettings.password"
              [(ngModel)]="element.password"
              [pattern]="passwordPattern"
            />
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="roleList">
        <th scope="col" mat-header-cell *matHeaderCellDef i18n="@@userSettings.roles">Roles</th>
        <td mat-cell *matCellDef="let element" class="paddingTd">
          <mat-form-field>
            <mat-label>Roles</mat-label>
            <mat-select [(ngModel)]="element.roleList" multiple>
              @for (role of roleList; track role) {
                <mat-option [value]="role">
                  {{ role }}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th scope="col" mat-header-cell *matHeaderCellDef i18n="@@userSettings.enabled">Enabled</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [(ngModel)]="element.enabled"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th scope="col" mat-header-cell *matHeaderCellDef i18n="@@userSettings.actions">Actions</th>
        <td mat-cell *matCellDef="let element" class="actionCell">
          <div class="actionZone">
            <button (click)="saveUser(element)" [disabled]="!isValidForSave(element)" matButton="elevated">
              <ng-container i18n="@@generic.save">Save</ng-container>
            </button>
            <button class="mat-warn" (click)="deleteUser(element)" matButton="elevated">
              <ng-container i18n="@@generic.delete">Delete</ng-container>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>

  <div class="creationZone">
    <button (click)="createUser()" matButton="elevated" i18n="@@userSettings.createUser">Create user</button>
  </div>
</div>
