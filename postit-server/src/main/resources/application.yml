# CORE
debug: false
trace: false
spring:
  application:
    name: Post It
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  http:
    codecs:
      max-in-memory-size: 5MB

# DATASOURCE
  jpa:
    hibernate:
      ddl-auto: validate

# SERVER & WEB
  web:
    resources:
      add-mappings: false

server:
  port: 8080
  servlet:
    context-path: /

# ACTUATOR
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

# INFO
info:
  app:
    name: Postit Server
    description: Back to manage notes
    version: 0.9.2-SNAPSHOT

### PERSO (MYAPP)
myapp:
  
# WEB SOCKET
  websocket:
    enable-cors: true
